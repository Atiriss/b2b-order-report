function renderTable(b,s,w,q) {
  let rows = ALL;
  if(b) rows = rows.filter(r => r[1]===b);
  if(s) rows = rows.filter(r => r[2]===s);
  if(w) rows = rows.filter(r => r[11]===w);
  if(q) { const lq=q.toLowerCase(); rows=rows.filter(r=>r.slice(0,8).some(v=>String(v||'').toLowerCase().includes(lq))); }
  document.getElementById('filterCount').textContent = '共 '+rows.length+' 条';
  const tbody = document.querySelector('#detailTable tbody');
  const show = rows.slice(0, 200);
  tbody.innerHTML = show.map(r => '<tr>' +
    '<td title="'+r[0]+'">'+String(r[0]).slice(-14)+'</td>' +
    '<td>'+r[1]+'</td>' +
    '<td><span class="status status-'+r[2]+'">'+r[2]+'</span></td>' +
    '<td>'+r[3]+'</td>' +
    '<td title="'+r[4]+'">'+r[4]+'</td>' +
    '<td>'+r[5]+'</td>' + '<td>'+r[6]+'</td>' +
    '<td title="'+r[7]+'">'+r[7]+'</td>' +
    '<td>'+r[8]+'</td>' + '<td>'+r[9]+'</td>' + '<td>'+r[10]+'</td>' + '<td>'+r[11]+'</td>' +
    '</tr>').join('');
}
