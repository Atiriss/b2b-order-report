function renderTable(b,s,w,q) {
  var rows = ALL;
  if(b) rows = rows.filter(function(r){return r[1]===b;});
  if(s) rows = rows.filter(function(r){return r[2]===s;});
  if(w) rows = rows.filter(function(r){return r[11]===w;});
  if(q) { var lq=q.toLowerCase(); rows=rows.filter(function(r){return r.slice(0,8).some(function(v){return String(v||'').toLowerCase().indexOf(lq)!==-1;});}); }
  document.getElementById('filterCount').textContent = rows.length + ' 条';
  var tbody = document.querySelector('#detailTable tbody');
  var show = rows;
  var html = '';
  for(var i=0; i<show.length; i++) {
    var r = show[i];
    html += '<tr>' +
      '<td title="'+r[0]+'">'+String(r[0])+'</td>' +
      '<td>'+r[1]+'</td>' +
      '<td><span class="status status-'+r[2]+'">'+r[2]+'</span></td>' +
      '<td>'+r[3]+'</td>' +
      '<td title="'+r[4]+'">'+r[4]+'</td>' +
      '<td>'+r[5]+'</td>' +
      '<td>'+r[6]+'</td>' +
      '<td title="'+r[7]+'">'+r[7]+'</td>' +
      '<td>'+r[8]+'</td>' +
      '<td>'+r[9]+'</td>' +
      '<td>'+r[10]+'</td>' +
      '<td>'+r[11]+'</td>' +
    '</tr>';
  }
  tbody.innerHTML = html;
}
